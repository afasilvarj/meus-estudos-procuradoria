<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meus Estudos Procuradoria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Meus Estudos Procuradoria</h1>

  <nav>
    <button onclick="mostrarTela('dashboard')">Dashboard</button>
    <button onclick="mostrarTela('ciclo')">Ciclo de Estudos</button>
    <button onclick="mostrarTela('registro')">Registro Diário</button>
    <button onclick="mostrarTela('gabarito')">Corretor de Gabaritos</button>
    <button onclick="mostrarTela('backup')">Backup</button>
  </nav>

  <main>
    <section id="dashboard" class="tela">
      <h2>Dashboard</h2>
      <p>Resumo geral dos seus estudos.</p>
    </section>

    <section id="ciclo" class="tela">
      <h2>Ciclo de Estudos</h2>
    </section>

<section id="registro" class="tela">
  <h2>Registro Diário</h2>

  <input id="dataEstudo" type="date">
  <input id="disciplinaEstudo" type="text" placeholder="Disciplina">
  <input id="tempoEstudo" type="number" placeholder="Tempo em minutos">
  <input id="conteudoEstudo" type="text" placeholder="Conteúdo estudado">

  <button onclick="salvarRegistroEstudo()">Salvar registro</button>

  <h3>Registros salvos</h3>
  <ul id="listaRegistros"></ul>
</section>

<section id="gabarito" class="tela">
  <h2>Corretor de Gabaritos</h2>

  <input id="disciplinaQuestao" type="text" placeholder="Disciplina">
  <input id="aulaQuestao" type="text" placeholder="Aula">
  <input id="numeroQuestao" type="number" placeholder="Nº da questão">
  <input id="respostaMarcada" type="text" placeholder="Resposta marcada">
  <input id="gabaritoOficial" type="text" placeholder="Gabarito oficial">

  <button onclick="salvarQuestao()">Salvar questão</button>

  <h3>Questões salvas</h3>
  <ul id="listaQuestoes"></ul>
</section>

    <section id="backup" class="tela">
      <h2>Backup</h2>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
